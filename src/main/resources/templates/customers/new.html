<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Add Customer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: navbar('customers')}"></div>

    <main class="page">
        <div class="page-header">
            <div>
                <p class="eyebrow">Bike Shop</p>
                <h1>Add Customer</h1>
            </div>
        </div>

        <section class="next-steps">
            <div class="alert warning" th:if="${databaseError}">
                The customer could not be saved yet. Run database-ddl.sql in MySQL Workbench and check the MySQL password in application.properties.
            </div>

            <form th:action="@{/customers}" th:object="${userForm}" method="post">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="firstName">First Name</label>
                        <input id="firstName" th:field="*{firstName}">
                        <div class="error" th:errors="*{firstName}"></div>
                    </div>

                    <div class="form-field">
                        <label for="lastName">Last Name</label>
                        <input id="lastName" th:field="*{lastName}">
                        <div class="error" th:errors="*{lastName}"></div>
                    </div>

                    <div class="form-field">
                        <label for="email">Email</label>
                        <input id="email" type="email" th:field="*{email}">
                        <div class="error" th:errors="*{email}"></div>
                    </div>

                    <div class="form-field">
                        <label for="phone">Phone</label>
                        <input id="phone" th:field="*{phone}">
                        <div class="error" th:errors="*{phone}"></div>
                    </div>
                </div>

                <div class="form-actions">
                    <a class="button secondary" th:href="@{/customers}">Cancel</a>
                    <button class="button" type="submit">Save Customer</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
