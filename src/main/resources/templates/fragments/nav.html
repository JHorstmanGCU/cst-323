<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Shared menu used on every page. -->
    <nav class="navbar" th:fragment="navbar(activePage)">
        <div class="nav-inner">
            <a class="nav-brand" th:href="@{/}">Bike Shop Order Tracker</a>

            <div class="nav-menu">
                <a th:href="@{/}"
                   th:classappend="${activePage == 'home'} ? ' active' : ''">Dashboard</a>
                <a th:href="@{/customers}"
                   th:classappend="${activePage == 'customers'} ? ' active' : ''">Customers</a>
                <a th:href="@{/bikes}"
                   th:classappend="${activePage == 'bikes'} ? ' active' : ''">Bikes</a>
                <a th:href="@{/parts}"
                   th:classappend="${activePage == 'parts'} ? ' active' : ''">Parts</a>
                <a th:href="@{/service-orders}"
                   th:classappend="${activePage == 'service-orders'} ? ' active' : ''">Service Orders</a>
            </div>
        </div>
    </nav>
</body>
</html>
